<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Harry Potter: Half-Blood Prince - Team Quiz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --text:#0f172a;
      --muted:#64748b;
      --border:#e2e8f0;
      --shadow:0 16px 40px rgba(15,23,42,.10);
      --brand:#2563eb;
      --brand-weak:#eff6ff;
      --success:#16a34a;
      --success-weak:#dcfce7;
      --danger:#dc2626;
      --danger-weak:#fee2e2;
      --radius:16px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 70% 20%, #eef6ff 0%, rgba(238,246,255,0) 60%),
        radial-gradient(700px 450px at 25% 35%, #f3f7ff 0%, rgba(243,247,255,0) 55%),
        linear-gradient(180deg, #f6f9ff 0%, #ffffff 55%);
    }

    .page{
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 16px 24px;
    }

    .header{
      display:flex;
      align-items:flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .title-wrap{
      display:flex;
      align-items:flex-start;
      gap: 12px;
      min-width: 0;
    }

    .badge{
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--brand);
      display:grid;
      place-items:center;
      flex: 0 0 auto;
      box-shadow: 0 10px 20px rgba(37,99,235,.18);
    }

    .kicker{
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 2px;
    }
    h1{
      margin: 2px 0 0;
      font-size: 22px;
      line-height: 1.2;
    }
    .subtitle{
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .card{
      background:#fff;
      border:1px solid rgba(226,232,240,.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .topline{
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .progress{
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    .bar{
      height: 6px;
      background: #eef2f7;
      border-radius: 999px;
      overflow:hidden;
      flex: 1 1 auto;
      max-width: 460px;
    }
    .bar > span{
      display:block;
      height: 100%;
      width: 0%;
      background: var(--brand);
      border-radius: 999px;
    }

    .q{
      font-size: 16px;
      font-weight: 800;
      margin: 10px 0 12px;
      line-height: 1.3;
    }

    .answers{
      display:flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .option{
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 12px;
      display:flex;
      gap: 10px;
      align-items:flex-start;
      cursor:pointer;
      background:#fff;
      transition: .12s ease;
    }
    .option:hover{
      background:#f8fafc;
    }

    .pill{
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid var(--border);
      display:grid;
      place-items:center;
      font-weight: 800;
      color: var(--muted);
      flex: 0 0 auto;
      margin-top: 1px;
    }

    .opt-text{
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
    }

    .option.selected{
      border-color: rgba(37,99,235,.45);
      background: var(--brand-weak);
    }
    .option.selected .pill{
      border-color: rgba(37,99,235,.45);
      color: var(--brand);
      background:#fff;
    }

    .controls{
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 16px;
      border-top: 1px solid rgba(226,232,240,.8);
      padding-top: 14px;
    }

    .btn{
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 800;
      font-size: 14px;
      border: 1px solid transparent;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      gap: 8px;
      line-height: 1;
      user-select:none;
      cursor:pointer;
      background:#fff;
    }
    .btn-primary{
      background: var(--brand);
      color:#fff;
      box-shadow: 0 10px 20px rgba(37,99,235,.18);
    }
    .btn-secondary{
      border-color: var(--border);
      color: var(--text);
    }
    .btn:disabled{
      opacity: .5;
      cursor:not-allowed;
      box-shadow:none;
    }

    .hint{
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .result{
      display:flex;
      gap: 14px;
      align-items:flex-start;
    }
    .result-icon{
      width: 46px;
      height: 46px;
      border-radius: 999px;
      background: var(--success-weak);
      border: 1px solid #bbf7d0;
      display:flex;
      align-items:center;
      justify-content:center;
      flex: 0 0 auto;
    }
    .result-title{
      font-size: 18px;
      font-weight: 900;
      margin: 2px 0 4px;
    }
    .result-sub{
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .score{
      margin-top: 12px;
      display:inline-flex;
      gap: 8px;
      align-items:center;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      background:#fff;
      font-weight: 800;
      font-size: 14px;
    }

    @media (max-width: 640px){
      .topline{ flex-direction: column; align-items:flex-start; }
      .bar{ max-width: 100%; width:100%; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="header">
      <div class="title-wrap">
        <div class="badge" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M7 7h10v10H7z" stroke="white" stroke-width="2" opacity=".95"/>
            <path d="M9 10h6M9 13h6" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>

        <div style="min-width:0;">
          <div class="kicker">Team quiz</div>
          <h1>Harry Potter and the Half-Blood Prince</h1>
          <p class="subtitle">Multiple choice. No quotes, just plot and details. Good for team warmup.</p>
        </div>
      </div>

      <button class="btn btn-secondary" id="btnRestartTop" type="button">Restart</button>
    </div>

    <div class="card" id="quizCard">
      <div class="topline">
        <div class="progress" id="progressText">1 / 1</div>
        <div class="bar" aria-label="Progress">
          <span id="progressBar"></span>
        </div>
      </div>

      <div class="q" id="questionText">Question</div>
      <div class="answers" id="answers"></div>

      <div class="controls">
        <button class="btn btn-secondary" id="btnPrev" type="button">Previous</button>
        <div class="hint" id="hint">Select an answer</div>
        <button class="btn btn-primary" id="btnNext" type="button" disabled>Next</button>
      </div>
    </div>

    <div class="card" id="resultCard" style="display:none;">
      <div class="result">
        <div class="result-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M20 12a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" stroke="#16a34a" stroke-width="2"/>
            <path d="m8 12 2.5 2.5L16 9" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <div class="kicker">Quiz</div>
          <div class="result-title">Quiz completed</div>
          <p class="result-sub">Share the score with your team. Then restart for another run.</p>

          <div class="score" id="scorePill">Score: 0 / 0</div>

          <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn btn-primary" id="btnRestart" type="button">Restart</button>
            <a class="btn btn-secondary" href="./" role="button">Back to completion demo</a>
            <a class="btn btn-secondary" href="./sidebar.html" role="button">Back to sidebar demo</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Вопросы по "Принцу-полукровке".
    // Без цитат, только факты. Если где-то не совпадет с твоей версией квиза, скажи, поправим под ваши правила.
    const QUESTIONS = [
      {
        q: "Who is the new Potions professor in Harry’s sixth year?",
        a: ["Severus Snape", "Horace Slughorn", "Minerva McGonagall", "Filius Flitwick"],
        correct: 1
      },
      {
        q: "What subject does Snape finally teach this year?",
        a: ["Charms", "Defense Against the Dark Arts", "Transfiguration", "Herbology"],
        correct: 1
      },
      {
        q: "What is the nickname of Snape’s old textbook Harry uses in Potions?",
        a: ["The Lost Student", "The Half-Blood Prince", "The Potion King", "The Dark Scholar"],
        correct: 1
      },
      {
        q: "Which memory does Harry obtain from Slughorn after strong persuasion?",
        a: ["Voldemort’s first duel", "A conversation about Horcruxes", "The prophecy in full", "Dumbledore’s youth"],
        correct: 1
      },
      {
        q: "What is the name of the love potion sold in the joke shop that appears in the story?",
        a: ["Felix Felicis", "Veritaserum", "Amortentia", "Draught of Peace"],
        correct: 2
      },
      {
        q: "Which student is affected by a cursed necklace intended for someone else?",
        a: ["Katie Bell", "Lavender Brown", "Parvati Patil", "Cho Chang"],
        correct: 0
      },
      {
        q: "Who is poisoned after drinking mead meant as a gift for Dumbledore?",
        a: ["Ron Weasley", "Harry Potter", "Hermione Granger", "Neville Longbottom"],
        correct: 0
      },
      {
        q: "What is the name of the lucky potion Harry uses to achieve a key goal?",
        a: ["Polyjuice Potion", "Felix Felicis", "Wolfsbane Potion", "Skele-Gro"],
        correct: 1
      },
      {
        q: "Which object is used as a Horcrux and is connected to Salazar Slytherin?",
        a: ["A diadem", "A locket", "A ring", "A cup"],
        correct: 1
      },
      {
        q: "What is the name of the girl Draco takes to Slughorn’s party?",
        a: ["Pansy Parkinson", "Millicent Bulstrode", "Romilda Vane", "Blaise Zabini"],
        correct: 0
      },
      {
        q: "Which spell from the Prince’s notes causes severe injury when used by Harry?",
        a: ["Expelliarmus", "Sectumsempra", "Stupefy", "Petrificus Totalus"],
        correct: 1
      },
      {
        q: "Who does Harry suspect of being behind the attacks and plotting in the castle?",
        a: ["Seamus Finnigan", "Draco Malfoy", "Ernie Macmillan", "Dean Thomas"],
        correct: 1
      },
      {
        q: "What is the name of the secret passage cabinet involved in Draco’s plan?",
        a: ["The Vanishing Cabinet", "The Listening Cabinet", "The Time Cabinet", "The Sorting Cabinet"],
        correct: 0
      },
      {
        q: "Where do Dumbledore and Harry go to retrieve the locket?",
        a: ["The Forbidden Forest", "A seaside cave", "Hogsmeade cellar", "The Ministry"],
        correct: 1
      },
      {
        q: "What protects the locket in the cave area?",
        a: ["A dragon", "Inferi", "Dementors", "Acromantulas"],
        correct: 1
      }
    ];

    let idx = 0;
    const chosen = new Array(QUESTIONS.length).fill(null);

    const quizCard = document.getElementById("quizCard");
    const resultCard = document.getElementById("resultCard");

    const progressText = document.getElementById("progressText");
    const progressBar = document.getElementById("progressBar");
    const questionText = document.getElementById("questionText");
    const answersEl = document.getElementById("answers");

    const btnPrev = document.getElementById("btnPrev");
    const btnNext = document.getElementById("btnNext");
    const hint = document.getElementById("hint");

    const scorePill = document.getElementById("scorePill");

    const btnRestart = document.getElementById("btnRestart");
    const btnRestartTop = document.getElementById("btnRestartTop");

    function render(){
      const total = QUESTIONS.length;
      const qObj = QUESTIONS[idx];

      progressText.textContent = (idx + 1) + " / " + total;
      progressBar.style.width = Math.round(((idx + 1) / total) * 100) + "%";

      questionText.textContent = qObj.q;

      answersEl.innerHTML = "";
      qObj.a.forEach((txt, i) => {
        const row = document.createElement("div");
        row.className = "option" + (chosen[idx] === i ? " selected" : "");
        row.setAttribute("role", "button");
        row.onclick = () => {
          chosen[idx] = i;
          btnNext.disabled = false;
          hint.textContent = "Answer selected";
          render();
        };

        const pill = document.createElement("div");
        pill.className = "pill";
        pill.textContent = String.fromCharCode(65 + i); // A B C D

        const t = document.createElement("div");
        t.className = "opt-text";
        t.textContent = txt;

        row.appendChild(pill);
        row.appendChild(t);
        answersEl.appendChild(row);
      });

      btnPrev.disabled = (idx === 0);

      if (chosen[idx] === null){
        btnNext.disabled = true;
        hint.textContent = "Select an answer";
      } else {
        btnNext.disabled = false;
        hint.textContent = "Answer selected";
      }

      btnNext.textContent = (idx === total - 1) ? "Finish" : "Next";
    }

    function finish(){
      let score = 0;
      for (let i = 0; i < QUESTIONS.length; i++){
        if (chosen[i] === QUESTIONS[i].correct) score++;
      }

      quizCard.style.display = "none";
      resultCard.style.display = "block";
      scorePill.textContent = "Score: " + score + " / " + QUESTIONS.length;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function restart(){
      idx = 0;
      for (let i = 0; i < chosen.length; i++) chosen[i] = null;
      resultCard.style.display = "none";
      quizCard.style.display = "block";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    btnPrev.onclick = () => { idx = Math.max(0, idx - 1); render(); };
    btnNext.onclick = () => {
      if (chosen[idx] === null) return;
      if (idx === QUESTIONS.length - 1) finish();
      else { idx++; render(); }
    };

    btnRestart.onclick = restart;
    btnRestartTop.onclick = restart;

    render();
  </script>
</body>
</html>
