<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Гарри Поттер: Принц-полукровка - Командный квиз</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --text:#0f172a;
      --muted:#64748b;
      --border:#e2e8f0;
      --shadow:0 16px 40px rgba(15,23,42,.10);
      --brand:#2563eb;
      --brand-weak:#eff6ff;
      --success:#16a34a;
      --success-weak:#dcfce7;
      --danger:#dc2626;
      --danger-weak:#fee2e2;
      --radius:16px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 70% 20%, #eef6ff 0%, rgba(238,246,255,0) 60%),
        radial-gradient(700px 450px at 25% 35%, #f3f7ff 0%, rgba(243,247,255,0) 55%),
        linear-gradient(180deg, #f6f9ff 0%, #ffffff 55%);
    }

    .page{
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 16px 24px;
    }

    .header{
      display:flex;
      align-items:flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .title-wrap{
      display:flex;
      align-items:flex-start;
      gap: 12px;
      min-width: 0;
    }

    .badge{
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--brand);
      display:grid;
      place-items:center;
      flex: 0 0 auto;
      box-shadow: 0 10px 20px rgba(37,99,235,.18);
    }

    .kicker{
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 2px;
    }
    h1{
      margin: 2px 0 0;
      font-size: 22px;
      line-height: 1.2;
    }
    .subtitle{
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .toolbar{
      display:flex;
      align-items:center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .select{
      border: 1px solid var(--border);
      background:#fff;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 700;
      font-size: 14px;
      color: var(--text);
      min-width: 280px;
      outline: none;
    }

    .card{
      background:#fff;
      border:1px solid rgba(226,232,240,.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .topline{
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .progress{
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    .bar{
      height: 6px;
      background: #eef2f7;
      border-radius: 999px;
      overflow:hidden;
      flex: 1 1 auto;
      max-width: 460px;
    }
    .bar > span{
      display:block;
      height: 100%;
      width: 0%;
      background: var(--brand);
      border-radius: 999px;
    }

    .q{
      font-size: 16px;
      font-weight: 800;
      margin: 10px 0 12px;
      line-height: 1.3;
    }

    .answers{
      display:flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .option{
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 12px;
      display:flex;
      gap: 10px;
      align-items:flex-start;
      cursor:pointer;
      background:#fff;
      transition: .12s ease;
      user-select:none;
    }
    .option:hover{
      background:#f8fafc;
    }

    .pill{
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid var(--border);
      display:grid;
      place-items:center;
      font-weight: 800;
      color: var(--muted);
      flex: 0 0 auto;
      margin-top: 1px;
    }

    .opt-text{
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
    }

    /* Мгновенная проверка */
    .option.correct{
      border-color: rgba(22,163,74,.45);
      background: var(--success-weak);
    }
    .option.correct .pill{
      border-color: rgba(22,163,74,.45);
      color: var(--success);
      background:#fff;
    }

    .option.wrong{
      border-color: rgba(220,38,38,.45);
      background: var(--danger-weak);
    }
    .option.wrong .pill{
      border-color: rgba(220,38,38,.45);
      color: var(--danger);
      background:#fff;
    }

    .option.locked{
      cursor: default;
    }
    .option.locked:hover{
      background: inherit;
    }

    .controls{
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 16px;
      border-top: 1px solid rgba(226,232,240,.8);
      padding-top: 14px;
    }

    .btn{
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 800;
      font-size: 14px;
      border: 1px solid transparent;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      gap: 8px;
      line-height: 1;
      user-select:none;
      cursor:pointer;
      background:#fff;
    }
    .btn-primary{
      background: var(--brand);
      color:#fff;
      box-shadow: 0 10px 20px rgba(37,99,235,.18);
    }
    .btn-secondary{
      border-color: var(--border);
      color: var(--text);
    }
    .btn:disabled{
      opacity: .5;
      cursor:not-allowed;
      box-shadow:none;
    }

    .hint{
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .result{
      display:flex;
      gap: 14px;
      align-items:flex-start;
    }
    .result-icon{
      width: 46px;
      height: 46px;
      border-radius: 999px;
      background: var(--success-weak);
      border: 1px solid #bbf7d0;
      display:flex;
      align-items:center;
      justify-content:center;
      flex: 0 0 auto;
    }
    .result-title{
      font-size: 18px;
      font-weight: 900;
      margin: 2px 0 4px;
    }
    .result-sub{
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .score{
      margin-top: 12px;
      display:inline-flex;
      gap: 8px;
      align-items:center;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      background:#fff;
      font-weight: 800;
      font-size: 14px;
    }

    @media (max-width: 640px){
      .topline{ flex-direction: column; align-items:flex-start; }
      .bar{ max-width: 100%; width:100%; }
      .select{ min-width: 100%; }
    }
  </style>
</head>

      { q: "Кто упоминается как глава Пожирателей смерти?", correct: "Волан-де-Морт", wrong: ["Дамблдор", "Скримджер", "Слизнорт"] },

      { q: "Как называется вторая глава книги «Гарри Поттер и Принц-полукровка»?", correct: "Паучий тупик", wrong: ["Принц-полукровка", "Непреложный обет", "Снегг торжествует"] },
      { q: "Кто из присутствующих в доме был незваным свидетелем разговора?", correct: "Питер Петтигрю", wrong: ["Драко Малфой", "Люциус Малфой", "Кингсли Бруствер"] },
      { q: "Кто первым заговорил о Непреложном обете?", correct: "Беллатриса Лестрейндж", wrong: ["Нарцисса Малфой", "Северус Снегг", "Питер Петтигрю"] },
      { q: "Между кем был заключен Непреложный обет?", correct: "Между Северусом Снеггом и Нарциссой Малфой", wrong: ["Между Беллатрисой и Нарциссой", "Между Снеггом и Беллатрисой", "Между Драко и Люциусом"] }
    ];

    const CHAPTERS = CHAPTER_TITLES.map((title, i) => ({
      id: i + 1,
      title,
      questions: []
    }));
    CHAPTERS[0].questions = CHAPTER_1_QUESTIONS;
    CHAPTERS[1].questions = CHAPTER_2_QUESTIONS;

    const chapterSelect = document.getElementById("chapterSelect");

    const quizCard = document.getElementById("quizCard");
    const resultCard = document.getElementById("resultCard");

    const progressText = document.getElementById("progressText");
    const progressBar = document.getElementById("progressBar");
    const questionText = document.getElementById("questionText");
    const answersEl = document.getElementById("answers");

    const btnPrev = document.getElementById("btnPrev");
    const btnNext = document.getElementById("btnNext");
    const hint = document.getElementById("hint");

    const scorePill = document.getElementById("scorePill");
    const resultTitle = document.getElementById("resultTitle");

    const btnRestart = document.getElementById("btnRestart");
    const btnRestartTop = document.getElementById("btnRestartTop");

    let currentChapterId = 1;
    let QUESTIONS = [];
    let idx = 0;
    let chosen = [];
    let revealed = [];

    function shuffle(arr){
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function normalizeQuestions(raw){
      return raw.map(item => {
        const options = shuffle([item.correct, ...item.wrong]);
        return {
          q: item.q,
          a: options,
          correct: options.indexOf(item.correct)
        };
      });
    }

    function loadChapter(chapterId){
      currentChapterId = chapterId;
      const chapter = CHAPTERS.find(c => c.id === chapterId);

      QUESTIONS = normalizeQuestions(chapter.questions || []);

      idx = 0;
      chosen = new Array(QUESTIONS.length).fill(null);
      revealed = new Array(QUESTIONS.length).fill(false);

      resultCard.style.display = "none";
      quizCard.style.display = "block";

      if (QUESTIONS.length === 0){
        questionText.textContent = "В этой главе пока нет вопросов.";
        answersEl.innerHTML = "";
        progressText.textContent = "0 / 0";
        progressBar.style.width = "0%";
        btnPrev.disabled = true;
        btnNext.disabled = true;
        hint.textContent = "Добавь вопросы в эту главу";
        return;
      }

      render();
    }

    function render(){
      const total = QUESTIONS.length;
      const qObj = QUESTIONS[idx];

      progressText.textContent = (idx + 1) + " / " + total;
      progressBar.style.width = Math.round(((idx + 1) / total) * 100) + "%";

      questionText.textContent = qObj.q;

      answersEl.innerHTML = "";

      const isRevealed = revealed[idx] === true;
      const picked = chosen[idx];

      qObj.a.forEach((txt, i) => {
        const row = document.createElement("div");

        const classes = ["option"];
        if (isRevealed) classes.push("locked");

        if (isRevealed && i === qObj.correct) classes.push("correct");
        if (isRevealed && picked !== null && picked === i && picked !== qObj.correct) classes.push("wrong");

        row.className = classes.join(" ");
        row.setAttribute("role", "button");

        row.onclick = () => {
          if (revealed[idx]) return;
          chosen[idx] = i;
          revealed[idx] = true;
          btnNext.disabled = false;
          hint.textContent = (i === qObj.correct) ? "Верно" : "Неверно";
          render();
        };

        const pill = document.createElement("div");
        pill.className = "pill";
        pill.textContent = String.fromCharCode(65 + i);

        const t = document.createElement("div");
        t.className = "opt-text";
        t.textContent = txt;

        row.appendChild(pill);
        row.appendChild(t);
        answersEl.appendChild(row);
      });

      btnPrev.disabled = (idx === 0);

      if (!revealed[idx]){
        btnNext.disabled = true;
        hint.textContent = "Выбери ответ";
      } else {
        btnNext.disabled = false;
      }

      btnNext.textContent = (idx === total - 1) ? "Финиш" : "Далее";
    }

    function finish(){
      let score = 0;
      for (let i = 0; i < QUESTIONS.length; i++){
        if (chosen[i] === QUESTIONS[i].correct) score++;
      }

      const chapterTitle = CHAPTERS.find(c => c.id === currentChapterId)?.title || "Глава";
      resultTitle.textContent = "Глава: " + chapterTitle;

      quizCard.style.display = "none";
      resultCard.style.display = "block";
      scorePill.textContent = "Счет: " + score + " / " + QUESTIONS.length;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function restart(){
      loadChapter(currentChapterId);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    btnPrev.onclick = () => { idx = Math.max(0, idx - 1); render(); };

    btnNext.onclick = () => {
      if (!revealed[idx]) return;
      if (idx === QUESTIONS.length - 1) finish();
      else { idx++; render(); }
    };

    btnRestart.onclick = restart;
    btnRestartTop.onclick = restart;

    function initChapterSelect(){
      chapterSelect.innerHTML = "";
      CHAPTERS.forEach(ch => {
        const opt = document.createElement("option");
        opt.value = String(ch.id);
        opt.textContent = ch.id + ". " + ch.title;
        chapterSelect.appendChild(opt);
      });

      chapterSelect.value = "1";
      chapterSelect.onchange = (e) => {
        const id = parseInt(e.target.value, 10);
        loadChapter(id);
      };
    }

    initChapterSelect();
    loadChapter(1);
  </script>
